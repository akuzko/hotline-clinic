services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hotline
      POSTGRES_PASSWORD: hotline
      POSTGRES_DB: hotline
    ports:
      - '5434:5432' # 5432/5433 are often taken locally
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotline -d hotline']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
